# apps/driver es Flutter y no forma parte del workspace de pnpm.
packages:
  - apps/api
  - apps/web
  - apps/rider
  - apps/landing
  - packages/*

# Versiones compartidas: los paquetes las usan con "catalog:".
# TypeScript se queda en 6.0 porque typescript-eslint aún no soporta TypeScript 7.
catalog:
  '@types/node': ^24.19.1
  '@types/pg': ^8.23.1
  pg: ^8.23.1
  typescript: ~6.0.3
  vitest: ^5.0.3

minimumReleaseAgeExclude:
  - eslint@10.12.0
  - supertest@7.3.1

# Scripts de instalación: solo se permiten los que se aprueban explícitamente.
# Los de Testcontainers (ssh2 y sus binarios opcionales) no hacen falta.
allowBuilds:
  '@prisma/engines': true
  cpu-features: false
  prisma: true
  protobufjs: false
  ssh2: false
