name: shiftlane_driver
description: "App del chofer de Shiftlane"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_settings: ^9.0.0
  audioplayers: ^6.8.1
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  logging: ^1.3.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Sonidos del escaneo (infra/scripts/generar-sonidos-chofer.py).
    - assets/sounds/
