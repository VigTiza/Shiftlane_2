name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, tipos y pruebas (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . && pnpm exec prettier --check .
      - name: Tipos
        run: pnpm typecheck
      - name: Documentos de referencia
        run: pnpm docs:verificar
      - name: Pruebas
        # apps/api levanta PostgreSQL + PostGIS con Testcontainers (Docker del runner).
        run: pnpm -r --if-present run test

  driver:
    name: App del chofer (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análisis
        run: flutter analyze
      - name: Pruebas
        run: flutter test
