# Servicios para desarrollo local. Uso: pnpm services:up / pnpm services:down
# Los puertos solo se publican en 127.0.0.1. Valores por omisión de desarrollo; se pueden
# cambiar en infra/.env (ver infra/.env.example).
name: shiftlane

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiftlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiftlane}
      POSTGRES_DB: ${POSTGRES_DB:-shiftlane}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  # Almacenamiento de archivos compatible con S3 (consola en http://localhost:9001).
  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shiftlane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shiftlane-dev}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea el bucket "shiftlane" la primera vez.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-shiftlane} $${MINIO_ROOT_PASSWORD:-shiftlane-dev}
      && mc mb --ignore-existing local/shiftlane"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shiftlane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shiftlane-dev}
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
