name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, tipos y pruebas (Node)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: shiftlane
          POSTGRES_PASSWORD: shiftlane
          POSTGRES_DB: shiftlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftlane -d shiftlane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://shiftlane:shiftlane@localhost:5432/shiftlane_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . && pnpm exec prettier --check .
      - name: Tipos
        run: pnpm typecheck
      - name: Documentos de referencia
        run: pnpm docs:verificar
      - name: Pruebas
        run: pnpm -r --if-present run test

  driver:
    name: App del chofer (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análisis
        run: flutter analyze
      - name: Pruebas
        run: flutter test
